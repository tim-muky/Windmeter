<text x="40" y="505" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="bold" style="">So erkennst du die Pins:</text>
<text x="40" y="530" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#52514e" font-weight="normal" style="">1.  Die zehn Lötstellen liegen in einer Reihe an einer Längskante. Neben jeder steht die Bezeichnung in weißer Schrift,</text>
<text x="60" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#52514e" font-weight="normal" style="">bei manchen Platinen auf der Unterseite.</text>
<text x="40" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#52514e" font-weight="normal" style="">2.  Die Reihenfolge ist bei allen gängigen Modulen gleich: VDD, GND, SCL, SDA, ADDR, ALRT, dann A0 bis A3.</text>
<text x="60" y="590" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#52514e" font-weight="normal" style="">Versorgung und Bus an einem Ende, Messeingänge am anderen.</text>
<text x="40" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#52514e" font-weight="normal" style="">3.  Stiftleiste so einlöten, dass die Stifte nach unten zeigen und die Beschriftung von oben lesbar bleibt.</text>
<text x="40" y="638" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#52514e" font-weight="normal" style="">4.  Zweifel? Multimeter auf Durchgang: der GND-Pin piept gegen den Metallring der Befestigungslöcher, kein anderer Pin.</text>
